<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>伊拉喂饭计算器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 基础设置 */
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; 
            font-size: 17px; 
            line-height: 1.5;
            padding-bottom: 220px; 
            background-color: #f3f4f6;
            -webkit-font-smoothing: antialiased;
            /* 全局禁止长按选中，提升APP感 */
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }

        /* 字体层级 */
        .text-level-1 { font-size: 2.5rem; font-weight: 900; line-height: 1; }
        .text-level-2 { font-size: 1.1rem; font-weight: 700; }
        .text-level-3 { font-size: 0.9rem; color: #6B7280; font-weight: 500; }

        /* 卡片 */
        .card {
            background-color: white; 
            border-radius: 1.25rem; 
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.02); 
            padding: 1.5rem; 
            margin-bottom: 1.25rem; 
            border: 1px solid #F3F4F6;
        }

        /* 状态卡片特别样式 */
        .info-card {
            background: linear-gradient(135deg, #EFF6FF 0%, #DBEAFE 100%);
            border: 1px solid #BFDBFE;
            color: #1E40AF;
            text-align: center; 
        }

        /* 大按钮 (修复光标问题核心：select-none) */
        .btn-option {
            width: 100%;
            padding: 1rem 0.5rem;
            border: 2px solid #E5E7EB;
            background-color: #fff;
            border-radius: 1rem;
            font-weight: bold;
            color: #374151;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 85px;
            /* 关键修复：禁止选中和聚焦轮廓 */
            user-select: none; 
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }
        
        .btn-option:focus { outline: none; } 
        .btn-option:active { transform: scale(0.96); } 
        .btn-option.selected {
            background-color: #EFF6FF; border-color: #2563EB; color: #1D4ED8;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.15);
        }
        .btn-option.selected-pink {
            background-color: #FDF2F8; border-color: #DB2777; color: #BE185D;
            box-shadow: 0 4px 12px rgba(219, 39, 119, 0.15);
        }

        /* 底部悬浮栏 (回归深色样式 & 收窄高度) */
        .fixed-bottom {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            background: linear-gradient(to bottom, #1E40AF, #1e3a8a); /* 深蓝渐变 */
            color: white;
            padding: 1rem 1.5rem; /* 收窄上下内边距 */
            padding-bottom: max(1rem, env(safe-area-inset-bottom));
            box-shadow: 0 -4px 20px rgba(30, 64, 175, 0.25); /* 调整阴影颜色 */
            z-index: 50;
            border-top-left-radius: 1.5rem;
            border-top-right-radius: 1.5rem;
        }

        /* 加减按钮 */
        .stepper-btn {
            width: 3.5rem; height: 3.5rem;
            border-radius: 50%;
            background-color: white;
            border: 2px solid #E5E7EB;
            display: flex; align-items: center; justify-content: center;
            color: #4B5563; touch-action: manipulation;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .stepper-btn:active { background-color: #F3F4F6; transform: scale(0.92); }
        .stepper-icon { width: 1.5rem; height: 1.5rem; stroke-width: 2.5; }

        /* 下拉框 */
        select.big-select {
            width: 100%; height: 3.5rem;
            font-size: 1.1rem; padding: 0 1rem;
            border-radius: 0.75rem; border: 2px solid #E5E7EB;
            background-color: white; color: #1F2937;
            outline: none;
        }
        
        /* 标签徽章 */
        .badge-auto {
            display: inline-block;
            background-color: #DEF7EC;
            color: #03543F;
            font-size: 0.75rem;
            padding: 2px 8px;
            border-radius: 99px;
            font-weight: 700;
            margin-left: 8px;
            vertical-align: middle;
        }
    </style>
</head>
<body>

    <!-- 顶部 -->
    <div class="bg-white sticky top-0 z-20 border-b border-gray-100 shadow-sm">
        <div class="max-w-md mx-auto h-16 flex items-center justify-center relative">
            <h1 class="text-xl font-black text-gray-800 flex items-center">
                🐱 伊拉计算器
                <span class="ml-2 text-xs font-bold bg-pink-100 text-pink-700 px-2 py-1 rounded-full border border-pink-200">专属版</span>
            </h1>
        </div>
    </div>

    <div class="max-w-md mx-auto px-4 py-6 space-y-5">

        <!-- 0. 伊拉信息卡 -->
        <div class="card info-card">
            <!-- 年龄大字显示 -->
            <div class="mb-1 text-sm text-blue-500 font-bold uppercase tracking-wider opacity-70">CURRENT AGE</div>
            <h2 class="text-3xl font-black text-blue-900 mb-3" id="ageDetail">计算中...</h2>
            
            <!-- 阶段标签 -->
            <div>
                <span id="statusBadge" class="bg-white text-blue-600 px-4 py-1.5 rounded-full text-sm font-bold shadow-sm border border-blue-100 inline-block">--</span>
            </div>

            <!-- 术后提示 (仅在恢复期显示) -->
            <div class="mt-4 text-sm bg-white/60 p-3 rounded-xl text-left border border-blue-100 text-blue-800" id="recoveryTips" style="display: none;">
                🚑 <strong>术后恢复期：</strong> 刚做完绝育手术，系数已自动调整为 2.0，多吃肉肉补身体！
            </div>
        </div>

        <!-- 1. 体重输入 -->
        <div class="card">
            <h2 class="text-level-2 text-gray-800 mb-4 flex items-center">
                <span class="bg-gray-100 text-gray-600 w-7 h-7 rounded-full flex items-center justify-center text-sm mr-2">1</span>
                本周体重 (kg)
            </h2>
            
            <div class="flex items-center justify-between px-2 py-2 bg-gray-50 rounded-2xl mb-3">
                <button class="stepper-btn" onclick="changeWeight(-0.05)">
                    <svg class="stepper-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                </button>
                <div class="text-center flex-1">
                    <span id="weightDisplay" class="text-level-1 text-gray-800 tracking-tight">3.00</span>
                </div>
                <button class="stepper-btn" onclick="changeWeight(0.05)">
                    <svg class="stepper-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                </button>
            </div>
            <input type="hidden" id="weight" value="3.00">

            <!-- 智能分析提示 -->
            <div id="weightGuide" class="bg-orange-50 p-3 rounded-lg text-sm text-orange-800 font-medium border border-orange-100 flex items-start">
                <span class="text-lg mr-2">⚖️</span>
                <span id="weightGuideText">正在分析体型...</span>
            </div>
        </div>

        <!-- 2. 状态微调 -->
        <div class="card">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-level-2 text-gray-800 flex items-center">
                    <span class="bg-gray-100 text-gray-600 w-7 h-7 rounded-full flex items-center justify-center text-sm mr-2">2</span>
                    系数设置
                </h2>
                <span id="autoTag" class="text-xs text-green-600 bg-green-100 px-2 py-1 rounded font-bold">已自动匹配</span>
            </div>
            
            <div class="space-y-4">
                <!-- 自动选中的系数 -->
                <select id="factor" class="big-select" onchange="manualFactorChange()">
                    <option value="1.6">🔵 幼猫期 (4-6月 长身体)</option>
                    <option value="1.3">🟣 尴尬期/亚成体 (7-12月)</option>
                    <option value="1.2">🟠 成年/绝育 (1岁+ 维持)</option>
                    <option value="2.0">🟢 术后恢复 (刚做完手术)</option>
                    <option value="1.4">🏃‍♀️ 运动量巨大 (跑酷)</option>
                </select>

                <!-- 体况评分 -->
                <div class="pt-3 border-t border-gray-100">
                    <label class="text-sm text-gray-500 font-bold mb-2 block">现在看着胖吗？(摸肋骨)</label>
                    <select id="bcs" class="big-select" onchange="calculate()">
                        <option value="1.0" selected>✅ 完美 (稍微用力摸到骨头)</option>
                        <option value="1.1">⚠️ 偏瘦 (骨头明显/有腰身)</option>
                        <option value="0.9">⛔ 微胖 (摸不到骨头/没腰)</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- 3. 湿粮设置 -->
        <div class="card">
            <h2 class="text-level-2 text-gray-800 mb-4 flex items-center">
                <span class="bg-gray-100 text-gray-600 w-7 h-7 rounded-full flex items-center justify-center text-sm mr-2">3</span>
                今天湿粮吃多少?
            </h2>
            <div class="grid grid-cols-3 gap-3">
                <button type="button" class="btn-option selected-pink" onclick="setWet(0, this)">
                    <span class="text-xl">不吃</span>
                    <span class="text-xs text-gray-400 mt-1">0g</span>
                </button>
                <button type="button" class="btn-option" onclick="setWet(40, this)">
                    <span class="text-xl">半包</span>
                    <span class="text-xs text-gray-400 mt-1">40g</span>
                </button>
                <button type="button" class="btn-option" onclick="setWet(85, this)">
                    <span class="text-xl">一包</span>
                    <span class="text-xs text-gray-400 mt-1">85g</span>
                </button>
            </div>
            <input type="hidden" id="wetAmount" value="0">
        </div>

        <!-- 4. 干粮类型 -->
        <div class="text-center mb-8">
             <select id="dryCalorie" class="bg-transparent text-gray-400 text-sm border-b border-gray-300 pb-1 outline-none" onchange="calculate()">
                <option value="4200" selected>🔥 使用烘焙粮 (420kcal/100g)</option>
                <option value="3900">🍚 使用膨化粮 (390kcal/100g)</option>
                <option value="3500">🥗 使用减肥粮 (350kcal/100g)</option>
            </select>
        </div>

    </div>

    <!-- 底部结果 (回归深色样式) -->
    <div class="fixed-bottom">
        <div class="max-w-md mx-auto flex items-center justify-between">
            <div class="flex flex-col text-blue-100">
                <span class="text-xs font-bold mb-1 opacity-90">
                    湿粮 <span id="wetResultSticky" class="text-white bg-pink-500 px-1 rounded mx-0.5">0</span>g +
                </span>
                <span class="text-white text-lg font-bold">干粮还需喂:</span>
            </div>
            <div class="flex items-baseline text-white">
                <span id="dryResultSticky" class="text-6xl font-black text-yellow-300 leading-none" style="filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));">--</span>
                <span class="ml-1 text-xl font-bold text-blue-200">克</span>
            </div>
        </div>
    </div>

    <script>
        // === 核心数据 (伊拉专属配置) ===
        // 直接使用数字，避免 new Date(string) 的时区问题
        const YILA_DATA = {
            birthYear: 2025,
            birthMonth: 7, // 1-12
            birthDay: 31,
            neuterYear: 2026,
            neuterMonth: 1,
            neuterDay: 10,
            wetCalorie: 74 // kcal/100g
        };

        // === 状态变量 ===
        let currentAgeMonths = 0;
        let daysSinceNeuter = 0;

        // 初始化
        window.onload = function() {
            const savedWeight = localStorage.getItem('yila_last_weight');
            if (savedWeight) {
                document.getElementById('weight').value = savedWeight;
                document.getElementById('weightDisplay').innerText = savedWeight;
            }

            initYilaStatus();
            calculate();
        };

        // 初始化状态逻辑 (使用安全日期计算)
        function initYilaStatus() {
            const today = new Date();
            // 创建本地时间的日期对象 (月份需要-1，因为JS月份是0-11)
            const birthDate = new Date(YILA_DATA.birthYear, YILA_DATA.birthMonth - 1, YILA_DATA.birthDay);
            const neuterDate = new Date(YILA_DATA.neuterYear, YILA_DATA.neuterMonth - 1, YILA_DATA.neuterDay);

            // 1. 计算精准年龄
            let years = today.getFullYear() - birthDate.getFullYear();
            let months = today.getMonth() - birthDate.getMonth();
            let days = today.getDate() - birthDate.getDate();

            if (days < 0) {
                months--;
                // 获取上个月有多少天
                const prevMonth = new Date(today.getFullYear(), today.getMonth(), 0);
                days += prevMonth.getDate();
            }
            if (months < 0) {
                years--;
                months += 12;
            }
            
            const weeks = Math.round(days / 7);

            // 全局月龄
            currentAgeMonths = years * 12 + months;
            
            // 绝育天数
            const diffTime = today - neuterDate;
            daysSinceNeuter = Math.floor(diffTime / (1000 * 60 * 60 * 24));

            // 2. 更新显示文本
            let ageText = "";
            if (years > 0) {
                ageText = `${years}岁 ${months}个月`;
            } else {
                ageText = `${months}个月 ${weeks}周`;
            }
            document.getElementById('ageDetail').innerText = ageText;

            // 3. 初始系数判定 (含体重联动)
            const currentWeight = parseFloat(document.getElementById('weight').value);
            smartUpdateFactor(currentAgeMonths, daysSinceNeuter, currentWeight);
        }

        // 智能系数与状态更新 (核心逻辑)
        function smartUpdateFactor(months, neuterDays, weight) {
            const factorSelect = document.getElementById('factor');
            const statusBadge = document.getElementById('statusBadge');
            const recoveryTips = document.getElementById('recoveryTips');
            const autoTag = document.getElementById('autoTag');

            // 恢复自动匹配标签
            autoTag.classList.remove('hidden');

            // 优先判断：术后恢复期 (绝育后 14 天内)
            if (neuterDays >= 0 && neuterDays <= 14) {
                factorSelect.value = "2.0"; 
                statusBadge.innerText = "🚑 术后恢复期";
                statusBadge.className = "bg-green-100 text-green-700 px-4 py-1.5 rounded-full text-sm font-bold shadow-sm inline-block";
                recoveryTips.style.display = 'block'; 
                return; // 术后恢复期不因体重调整系数
            } 
            
            // 正常成长逻辑
            recoveryTips.style.display = 'none';
            statusBadge.className = "bg-white text-blue-600 px-4 py-1.5 rounded-full text-sm font-bold shadow-sm border border-blue-100 inline-block";
            
            if (months < 4) {
                factorSelect.value = "2.0"; 
                statusBadge.innerText = "🍼 幼猫期";
            } else if (months >= 4 && months < 7) {
                // 猛长期逻辑：如果太胖(>3.5kg)，降级为1.4
                if (weight > 3.5) {
                    factorSelect.value = "1.4";
                    statusBadge.innerText = "📈 猛长期 (偏胖控制)";
                } else {
                    factorSelect.value = "1.6";
                    statusBadge.innerText = "📈 快速生长期";
                }
            } else if (months >= 7 && months < 12) {
                // 尴尬期逻辑：如果太胖(>4.0kg)，降级为1.2
                if (weight > 4.0) {
                    factorSelect.value = "1.2";
                    statusBadge.innerText = "🌱 亚成体 (体重控制)";
                } else {
                    factorSelect.value = "1.3";
                    statusBadge.innerText = "🌱 亚成体/尴尬期";
                }
            } else {
                factorSelect.value = "1.2"; 
                statusBadge.innerText = "👑 成年期";
            }
        }

        // 手动修改系数
        function manualFactorChange() {
            document.getElementById('autoTag').classList.add('hidden');
            calculate();
        }

        // 调整体重
        function changeWeight(delta) {
            const weightInput = document.getElementById('weight');
            let currentWeight = parseFloat(weightInput.value);
            let newWeight = currentWeight + delta;
            if (newWeight < 0.1) newWeight = 0.1;
            
            newWeight = parseFloat(newWeight.toFixed(2));
            weightInput.value = newWeight;
            document.getElementById('weightDisplay').innerText = newWeight.toFixed(2);
            
            localStorage.setItem('yila_last_weight', newWeight);
            
            // 体重变化触发系数重新评估
            smartUpdateFactor(currentAgeMonths, daysSinceNeuter, newWeight);
            
            calculate();
        }

        // 湿粮选择
        function setWet(amount, btn) {
            document.getElementById('wetAmount').value = amount;
            
            const btns = document.querySelectorAll('.btn-option');
            btns.forEach(b => {
                b.classList.remove('selected-pink');
                b.classList.remove('border-pink-500');
            });
            btn.classList.add('selected-pink');
            
            calculate();
        }

        // 核心计算
        function calculate() {
            const weight = parseFloat(document.getElementById('weight').value);
            const factor = parseFloat(document.getElementById('factor').value);
            const bcsModifier = parseFloat(document.getElementById('bcs').value);
            const dryCalorieDensity = parseFloat(document.getElementById('dryCalorie').value);
            const wetAmount = parseFloat(document.getElementById('wetAmount').value);

            // 智能分析提示
            updateSmartAnalysis(currentAgeMonths, weight, bcsModifier);

            // RER = 70 * (体重 ^ 0.75)
            const rer = 70 * Math.pow(weight, 0.75);

            // DER
            const der = rer * factor * bcsModifier;

            // 湿粮热量
            const wetCalories = wetAmount * (YILA_DATA.wetCalorie / 100);

            // 剩余干粮
            let dryCaloriesNeeded = der - wetCalories;
            if (dryCaloriesNeeded < 0) dryCaloriesNeeded = 0;

            const dryAmount = dryCaloriesNeeded / (dryCalorieDensity / 1000);

            // 更新UI
            document.getElementById('wetResultSticky').innerText = wetAmount;
            document.getElementById('dryResultSticky').innerText = Math.round(dryAmount);
        }

        function updateSmartAnalysis(months, weight, bcs) {
            const guideText = document.getElementById('weightGuideText');
            let msg = "";
            let status = ""; 

            // 美短母猫大概生长标准
            if (months >= 4 && months <= 6) {
                if (weight < 2.0) status = "轻";
                else if (weight > 3.2) status = "重";
                else status = "正常";
                msg = `${months}个月还在长个子，`;
            } else if (months >= 7 && months < 12) {
                if (weight < 2.6) status = "轻";
                else if (weight > 4.0) status = "重";
                else status = "正常";
                msg = `${months}个月进入尴尬期，`;
            } else if (months >= 12) {
                if (weight < 3.2) status = "轻";
                else if (weight > 5.2) status = "重";
                else status = "正常";
                msg = `${months}个月已成年，`;
            } else {
                msg = "小宝宝阶段，";
                status = "正常";
            }

            if (bcs < 1.0) msg += "既然微胖就少吃点。";
            else if (bcs > 1.0) msg += "觉得瘦就多补点。";
            else {
                if (status === "轻") msg += "体重略轻，多吃一口没事的。";
                else if (status === "重") msg += "美短容易胖，注意保持哦。";
                else msg += "体重非常标准，继续保持！👏";
            }

            guideText.innerText = msg;
        }
    </script>
</body>
</html>
