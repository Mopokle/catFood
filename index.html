<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>伊拉喂饭计算器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 基础设置：防抖动，大字体 */
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; 
            font-size: 18px; 
            line-height: 1.5;
            padding-bottom: 180px; /* 给底部悬浮栏留位置 */
            background-color: #f3f4f6;
        }

        /* 大按钮基础样式 */
        .btn-option {
            width: 100%;
            padding: 1rem 0.5rem;
            border: 2px solid #E5E7EB;
            background-color: #fff;
            border-radius: 0.75rem;
            font-weight: bold;
            color: #374151;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 80px; /* 保证高度足够好点 */
        }
        
        /* 选中状态 - 蓝色 */
        .btn-option.selected {
            background-color: #EFF6FF;
            border-color: #2563EB;
            color: #1D4ED8;
            box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.3);
        }

        /* 选中状态 - 粉色 (给湿粮用) */
        .btn-option.selected-pink {
            background-color: #FDF2F8;
            border-color: #DB2777;
            color: #BE185D;
            box-shadow: 0 0 0 2px rgba(219, 39, 119, 0.3);
        }

        /* 底部悬浮栏 */
        .fixed-bottom {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to bottom, #1E40AF, #1e3a8a);
            color: white;
            padding: 1.25rem;
            box-shadow: 0 -4px 10px rgba(0,0,0,0.15);
            z-index: 50;
            border-top-left-radius: 1.5rem;
            border-top-right-radius: 1.5rem;
        }

        /* 加减按钮 - 修复居中问题 */
        .stepper-btn {
            width: 3.5rem;
            height: 3.5rem;
            border-radius: 50%;
            background-color: white;
            border: 2px solid #D1D5DB;
            /* 移除 font-size，改用 flex 居中 SVG */
            display: flex;
            align-items: center;
            justify-content: center;
            color: #4B5563;
            touch-action: manipulation; /* 防止双击缩放 */
            padding: 0; /* 移除默认内边距 */
        }
        .stepper-btn:active {
            background-color: #E5E7EB;
            transform: scale(0.95);
        }
        /* SVG 图标样式 */
        .stepper-icon {
            width: 1.75rem;
            height: 1.75rem;
            stroke-width: 3;
        }

        /* 分区标题 */
        .section-title {
            font-size: 1.25rem;
            font-weight: 800;
            color: #111827;
            margin-bottom: 0.75rem;
            display: flex;
            align-items: center;
        }
        .section-icon {
            background-color: #DBEAFE;
            color: #1E40AF;
            width: 2rem;
            height: 2rem;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 0.5rem;
            font-size: 1rem;
            line-height: 1; /* 修复数字垂直居中 */
            padding-top: 2px; /* 微调数字视觉中心 */
        }
        
        /* 下拉框大字体优化 */
        select.big-select {
            width: 100%;
            height: 3.5rem;
            font-size: 1.1rem;
            padding: 0 1rem;
            border-radius: 0.75rem;
            border: 2px solid #9CA3AF;
            background-color: white;
            color: #1F2937;
        }
    </style>
</head>
<body>

    <!-- 顶部简单标题 -->
    <div class="bg-white p-4 shadow-sm text-center mb-4">
        <h1 class="text-2xl font-black text-gray-800">🐱 伊拉吃饭计算器</h1>
    </div>

    <div class="max-w-md mx-auto px-4 space-y-6">

        <!-- 1. 湿粮选择 (最常变动) -->
        <div class="bg-white p-4 rounded-2xl shadow-sm">
            <h2 class="section-title">
                <span class="section-icon">1</span>
                今天吃多少罐头/湿粮？
            </h2>
            <div class="grid grid-cols-3 gap-3">
                <button type="button" class="btn-option selected-pink" onclick="setWet(0, this)">
                    <span class="text-xl">不吃</span>
                    <span class="text-xs font-normal text-gray-500 mt-1">0克</span>
                </button>
                <button type="button" class="btn-option" onclick="setWet(40, this)">
                    <span class="text-xl">半包</span>
                    <span class="text-xs font-normal text-gray-500 mt-1">40克</span>
                </button>
                <button type="button" class="btn-option" onclick="setWet(85, this)">
                    <span class="text-xl">一包</span>
                    <span class="text-xs font-normal text-gray-500 mt-1">85克</span>
                </button>
            </div>
            <!-- 隐藏的数值输入，用于计算 -->
            <input type="hidden" id="wetAmount" value="0">
        </div>

        <!-- 2. 体重调整 (常用) -->
        <div class="bg-white p-4 rounded-2xl shadow-sm">
            <h2 class="section-title">
                <span class="section-icon">2</span>
                现在多重？(公斤)
            </h2>
            <div class="flex items-center justify-between px-2 py-2 bg-gray-50 rounded-xl">
                <!-- 减号按钮：使用 SVG 替代文本符号 -->
                <button class="stepper-btn" onclick="changeWeight(-0.1)" aria-label="减少体重">
                    <svg class="stepper-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                </button>
                
                <!-- 中间数值区域：flex-1 确保占据所有剩余空间，严格居中 -->
                <div class="text-center flex-1">
                    <span id="weightDisplay" class="text-4xl font-black text-gray-800">2.9</span>
                    <span class="text-gray-500 font-bold">kg</span>
                </div>
                
                <!-- 加号按钮：使用 SVG 替代文本符号 -->
                <button class="stepper-btn" onclick="changeWeight(0.1)" aria-label="增加体重">
                    <svg class="stepper-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                </button>
            </div>
            <!-- 隐藏的实际数值 -->
            <input type="hidden" id="weight" value="2.92">
        </div>

        <!-- 3. 基础设置 (不太常动) -->
        <div class="bg-white p-4 rounded-2xl shadow-sm">
            <h2 class="section-title">
                <span class="section-icon">3</span>
                基础设置
            </h2>

            <!-- 成长阶段 -->
            <div class="mb-4">
                <label class="block text-gray-600 font-bold mb-2">现在的阶段？</label>
                <select id="factor" class="big-select" onchange="calculate()">
                    <option value="1.2">🟠 成年/绝育 (维持体重)</option>
                    <option value="1.6" selected>🔵 5-6月龄 (正在长身体)</option>
                    <option value="2.0">🟢 术后恢复 (多吃点)</option>
                    <option value="1.4">🏃‍♀️ 特别好动 (跑酷)</option>
                </select>
            </div>
            
            <!-- 体况 -->
            <div class="mb-4">
                <label class="block text-gray-600 font-bold mb-2">伊拉胖不胖？(摸肋骨)</label>
                <select id="bcs" class="big-select" onchange="calculate()">
                    <option value="1.0" selected>✅ 完美 (摸得到骨头)</option>
                    <option value="1.1">⚠️ 偏瘦 (骨头太明显)</option>
                    <option value="0.9">⛔ 微胖 (肉有点多)</option>
                </select>
            </div>

            <!-- 干粮热量 -->
            <div class="mb-2">
                <label class="block text-gray-600 font-bold mb-2">吃的哪种干粮？</label>
                <select id="dryCalorie" class="big-select" onchange="calculate()">
                    <option value="4200" selected>🔥 烘焙粮/高营养 (420kcal)</option>
                    <option value="3900">🍚 普通膨化粮 (390kcal)</option>
                    <option value="3500">🥗 减肥粮/低热量</option>
                </select>
                <p class="text-xs text-gray-400 mt-2 text-center">如果不确定，就保持默认“烘焙粮”</p>
            </div>
        </div>

        <!-- 提示信息 -->
        <div id="tipBox" class="bg-yellow-100 text-yellow-900 p-3 rounded-lg text-sm font-bold hidden">
            <!-- 动态提示 -->
        </div>

    </div>

    <!-- 始终悬浮的底部结果 -->
    <div class="fixed-bottom">
        <div class="max-w-md mx-auto flex items-center justify-between">
            <div class="flex flex-col">
                <span class="text-blue-200 text-sm font-bold mb-1">
                    湿粮吃 <span id="wetResultSticky" class="text-white bg-pink-500 px-1 rounded">0</span> g
                </span>
                <span class="text-white text-lg font-bold">还需喂干粮:</span>
            </div>
            <div class="flex items-baseline">
                <span id="dryResultSticky" class="text-6xl font-black text-yellow-300 leading-none">--</span>
                <span class="ml-1 text-xl font-bold text-yellow-100">克</span>
            </div>
        </div>
    </div>

    <script>
        // 预设参数
        // 湿粮默认热量更新为 74 kcal/100g
        const WET_CALORIE_DENSITY = 74; 

        function setWet(amount, btn) {
            // 1. 设置数值
            document.getElementById('wetAmount').value = amount;
            
            // 2. 切换按钮样式
            // 先清除所有粉色选中态
            const btns = document.querySelectorAll('.btn-option');
            btns.forEach(b => {
                b.classList.remove('selected-pink');
                b.classList.remove('border-pink-500');
            });
            // 给当前点击的按钮加上
            btn.classList.add('selected-pink');
            
            // 3. 重新计算
            calculate();
        }

        function changeWeight(delta) {
            const weightInput = document.getElementById('weight');
            let currentWeight = parseFloat(weightInput.value);
            
            // 计算新体重，保留2位小数
            let newWeight = currentWeight + delta;
            if (newWeight < 0.1) newWeight = 0.1; // 防止负数
            
            // 更新隐藏值
            weightInput.value = newWeight.toFixed(2);
            
            // 更新显示值 (保留1位小数显示给长辈看即可，更清爽)
            document.getElementById('weightDisplay').innerText = newWeight.toFixed(1);
            
            calculate();
        }

        function calculate() {
            // 获取数值
            const weight = parseFloat(document.getElementById('weight').value);
            const factor = parseFloat(document.getElementById('factor').value); 
            const bcsModifier = parseFloat(document.getElementById('bcs').value);
            const dryCalorieDensity = parseFloat(document.getElementById('dryCalorie').value);
            const wetAmount = parseFloat(document.getElementById('wetAmount').value);

            // RER = 70 * (体重 ^ 0.75)
            const rer = 70 * Math.pow(weight, 0.75);

            // DER = RER * 系数 * 体况
            const der = rer * factor * bcsModifier;

            // 湿粮热量
            const wetCalories = wetAmount * (WET_CALORIE_DENSITY / 100);

            // 剩余干粮热量
            let dryCaloriesNeeded = der - wetCalories;
            if (dryCaloriesNeeded < 0) dryCaloriesNeeded = 0;

            // 干粮克数 = 热量 / (热量密度/1000)
            const dryAmount = dryCaloriesNeeded / (dryCalorieDensity / 1000);

            // 更新 UI
            document.getElementById('wetResultSticky').innerText = wetAmount;
            document.getElementById('dryResultSticky').innerText = Math.round(dryAmount);

            // 提示逻辑
            updateTips(bcsModifier);
        }

        function updateTips(bcs) {
            const tipBox = document.getElementById('tipBox');
            if (bcs < 1.0) {
                tipBox.innerText = "💡 因为选了【微胖】，已自动减少一点饭量。";
                tipBox.classList.remove('hidden');
            } else if (bcs > 1.0) {
                tipBox.innerText = "🍖 因为选了【偏瘦】，已自动加了点饭量。";
                tipBox.classList.remove('hidden');
            } else {
                tipBox.classList.add('hidden');
            }
        }

        // 初始化运行一次
        calculate();
    </script>
</body>
</html>
